name: Build installable Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android signing tools
        uses: android-actions/setup-android@v3

      - name: Sign the installable APK
        shell: bash
        run: |
          sdkmanager "build-tools;35.0.0"
          keytool -genkeypair -keystore "$RUNNER_TEMP/thumby-release.jks" -storepass thumby-demo-2026 -keypass thumby-demo-2026 -alias thumby -keyalg RSA -keysize 4096 -validity 3650 -dname "CN=Thumby ERP, OU=Demo, O=Thumby ERP, L=Bengaluru, ST=Karnataka, C=IN"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/thumby-release.jks" --ks-key-alias thumby --ks-pass pass:thumby-demo-2026 --key-pass pass:thumby-demo-2026 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$RUNNER_TEMP/Thumby_ERP_Android_v2.apk" "Thumby_ERP_Demo.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/Thumby_ERP_Android_v2.apk"

      - name: Save the verified APK
        uses: actions/upload-artifact@v4
        with:
          name: thumby-erp-installable-apk
          path: ${{ runner.temp }}/Thumby_ERP_Android_v2.apk
          if-no-files-found: error
