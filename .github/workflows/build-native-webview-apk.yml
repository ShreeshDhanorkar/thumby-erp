name: Build native Thumby ERP Android app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-apk:
    name: Build clean native APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create clean native Android app
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/thumby-native"
          mkdir -p "$APP_DIR/app/src/main/java/com/thumbyerp/mobile"
          mkdir -p "$APP_DIR/app/src/main/res/drawable"
          mkdir -p "$APP_DIR/app/src/main/res/values"

          cat > "$APP_DIR/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ThumbyERP"
          include(":app")
          EOF

          cat > "$APP_DIR/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$APP_DIR/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.thumbyerp.mobile'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.thumbyerp.mobile'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF

          cat > "$APP_DIR/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Thumby ERP"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$APP_DIR/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:colorAccent">#11B5BE</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#082C32</item>
                  <item name="android:navigationBarColor">#082C32</item>
              </style>
          </resources>
          EOF

          cat > "$APP_DIR/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path android:fillColor="#12B8C2" android:pathData="M0,0h96v96h-96z" />
              <path android:fillColor="#FFFFFF" android:pathData="M22,23h52v12h-19v38h-14v-38h-19z" />
          </vector>
          EOF

          cat > "$APP_DIR/app/src/main/java/com/thumbyerp/mobile/MainActivity.java" <<'EOF'
          package com.thumbyerp.mobile;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public final class MainActivity extends Activity {
              private static final String APP_URL = "https://thumby-erp.onrender.com/";
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.WHITE);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT));

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  }

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, WebResourceRequest request) {
                          return false;
                      }
                  });
                  setContentView(webView);
                  webView.loadUrl(APP_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build and independently verify APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/gradle-8.9-bin.zip" \
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" -p "$RUNNER_TEMP/thumby-native" \
            --no-daemon :app:assembleDebug
          APK="$RUNNER_TEMP/thumby-native/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Thumby_ERP_Mobile.apk"
          sha256sum "$GITHUB_WORKSPACE/Thumby_ERP_Mobile.apk"

      - name: Upload verified native APK
        uses: actions/upload-artifact@v4
        with:
          name: thumby-erp-native-apk
          path: Thumby_ERP_Mobile.apk
          if-no-files-found: error
